configurations:
  - host: imap.gmail.com
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: true
    username: talati@getcultivate.ai
    passwordCMD: "python /usr/share/neomutt/oauth2/mutt_oauth2.py --encryption-pipe 'cat' --decryption-pipe 'cat' ~/decrypt/secrets/oauth/cultivate.oauth2"
    xoAuth2: true
    wait: 5
    idleLogoutTimeout: 10
    boxes:
      - mailbox: INBOX
        onNewMail: "mbsync cultivate:INBOX"
        onNewMailPost: "notify-mail ~/mail/cultivate/Inbox"
