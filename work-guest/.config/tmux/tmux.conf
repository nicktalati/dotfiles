set -g status-style bg=default
set -g history-limit 10000

# tmux's default status-right, with %H:%M swapped for a 12-hour clock
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %l:%M%P %d-%b-%y'
set -g clock-mode-style 12

set -g pane-border-style fg=black
set -g pane-active-border-style fg=black
set -g mouse on

# Ask the host terminal to handle clipboard writes via OSC 52. The physical
# Wayland target instead pipes copied text to wl-copy.
set -s set-clipboard on

setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

bind -n 'M-s' display-popup -E "tmux_launcher"
bind -n 'M-m' display-popup -w 95% -h 95% -E "neomutt"

bind -n 'M-h' 'select-pane -L'
bind -n 'M-j' 'select-pane -D'
bind -n 'M-k' 'select-pane -U'
bind -n 'M-l' 'select-pane -R'

bind -n 'M-0' 'select-window -t 0'
bind -n 'M-1' 'select-window -t 1'
bind -n 'M-2' 'select-window -t 2'
bind -n 'M-3' 'select-window -t 3'
bind -n 'M-4' 'select-window -t 4'
bind -n 'M-5' 'select-window -t 5'
bind -n 'M-6' 'select-window -t 6'
bind -n 'M-7' 'select-window -t 7'
bind -n 'M-8' 'select-window -t 8'
bind -n 'M-9' 'select-window -t 9'
