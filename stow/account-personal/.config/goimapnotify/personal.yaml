# goimapnotify reconnects only once it can reach these. Its defaults,
# archlinux.org:80 and ubuntu.com:80, are unreachable on some networks where
# Gmail is not.
connectivityHosts: ["imap.gmail.com:993"]
configurations:
  - host: imap.gmail.com
    port: 993
    tls: true
    tlsOptions:
      rejectUnauthorized: true
    username: "nicktalati@gmail.com"
    passwordCMD: "python /usr/share/neomutt/oauth2/mutt_oauth2.py --encryption-pipe 'cat' --decryption-pipe 'cat' ~/.local/share/mail/oauth/personal"
    xoAuth2: true
    wait: 5
    idleLogoutTimeout: 10
    boxes:
      - mailbox: "INBOX"
        onNewMail: "mail-sync personal INBOX"
